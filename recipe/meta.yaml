{% set name = "bunq-sdk" %}
{% set version = "1.28.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/bunq_sdk-{{ version }}.tar.gz
  sha256: d3a6f91fbcf7da01e0b0477b8f93e05290b84b20193e03df9b6a0dde35fb6c12

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - aenum >=2.2.4,<3.0.0
    - chardet >=3.0.4,<4.0.0
    - pycryptodomex >=3.9.8,<4.0.0
    - python >={{ python_min }}
    - requests >=2.24.0,<3.0.0
    - simplejson >=3.17.2,<4.0.0
    - urllib3 >=1.25.10,<2.0.0

test:
  imports:
    - bunq
    - bunq.sdk
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bunq/sdk_python
  summary: bunq Python SDK
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - step21
